{% assign financing_service = site.data.financing_programs[page.financing_key] %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {% if page.url == '/about-nicolas-lescalier-us/' %}
    {
      "@type": "ProfilePage",
      "@id": "https://nicolaslescalier.com/about-nicolas-lescalier-us/#profile",
      "url": "https://nicolaslescalier.com/about-nicolas-lescalier-us/",
      "name": {{ page.title | jsonify }},
      "mainEntity": { "@id": "https://nicolaslescalier.com/#person" },
      "isPartOf": { "@id": "https://nicolaslescalier.com/#website" }
    },
    {% endif %}
    {% if page.guide %}
    {
      "@type": "Article",
      "@id": {{ page.url | absolute_url | append: '#article' | jsonify }},
      "headline": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
      "dateModified": {{ page.last_reviewed | date: '%Y-%m-%d' | jsonify }},
      "author": { "@id": "https://nicolaslescalier.com/#person" },
      "publisher": { "@id": "https://nicolaslescalier.com/#person" },
      "inLanguage": "en-CA"
    },
    {% endif %}
    {
      "@type": "Person",
      "@id": "https://nicolaslescalier.com/#person",
      "name": "Nicolas Lescalier",
      "description": "Funding Manager offering direct funding on select deals, access to an extensive co-funding network, and guidance on business financing in Canada and the United States.",
      "jobTitle": "Funding Manager",
      "url": "https://nicolaslescalier.com/about-nicolas-lescalier-us/",
      "worksFor": {
        "@type": "Organization",
        "name": "Premium Merchant Funding",
        "url": "https://www.pmfus.com/"
      },
      "sameAs": [
        "https://www.linkedin.com/in/nicolaslescalier/",
        "https://about.me/nicolaslescalier",
        "https://medium.com/@nicolaslescalier",
        "https://nicolaslescalier.substack.com"
      ],
      "knowsAbout": [
        "working capital loans",
        "U.S. business financing",
        "Canadian business financing",
        "line of credit",
        "term loans",
        "equipment financing",
        "SBA 7(a)",
        "commercial real estate financing",
        "bridge loans"
      ]
    },
    {
      "@type": "WebSite",
      "@id": "https://nicolaslescalier.com/#website",
      "url": "https://nicolaslescalier.com",
      "name": "Nicolas Lescalier",
      "alternateName": "Nicolas Lescalier Canada and U.S. Business Financing",
      "description": "Commercial finance guidance, calculators, application routes, and service pages for working capital, term debt, SBA, equipment, invoice finance, and commercial real estate.",
      "publisher": {
        "@id": "https://nicolaslescalier.com/#person"
      },
      "inLanguage": "en-US"
    },
    {
      "@type": "Service",
      "@id": {% if financing_service %}{{ financing_service.path | absolute_url | append: "#service" | jsonify }}{% else %}"https://nicolaslescalier.com/#service"{% endif %},
      "name": {% if financing_service %}{{ financing_service.name | jsonify }}{% else %}"Business Financing and Funding Guidance"{% endif %},
      "serviceType": {% if financing_service %}{{ financing_service.name | jsonify }}{% else %}"Business financing"{% endif %},
      "provider": {
        "@id": "https://nicolaslescalier.com/#person"
      },
      "areaServed": [
        {% if financing_service %}{% for country in financing_service.countries %}{ "@type": "Country", "name": {{ country | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}{% else %}{ "@type": "Country", "name": "Canada" },
        { "@type": "Country", "name": "United States" }{% endif %}
      ],
      "availableChannel": {
        "@type": "ServiceChannel",
        "serviceUrl": "https://nicolaslescalier.com/contact/",
        "availableLanguage": "English"
      },
      "url": {% if financing_service %}{{ financing_service.path | absolute_url | jsonify }}{% else %}"https://nicolaslescalier.com/services/"{% endif %}
    }
  ]
}
</script>
