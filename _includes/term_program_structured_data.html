{% if page.term_program %}
{% assign program = site.data.term_program %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LoanOrCredit",
  "@id": {{ program.path | absolute_url | append: '#program' | jsonify }},
  "name": {{ program.name | jsonify }},
  "url": {{ program.path | absolute_url | jsonify }},
  "description": {{ page.description | jsonify }},
  "loanTerm": {"@type": "QuantitativeValue", "value": {{ program.term_months }}, "unitText": "months"},
  "annualPercentageRate": {"@type": "QuantitativeValue", "minValue": {{ program.apr_min }}, "maxValue": {{ program.apr_max }}, "unitText": "%"},
  "currency": [{% for market in program.markets %}{{ market.currency | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}],
  "areaServed": [{% for market in program.markets %}{"@type": "Country", "name": {{ market.country | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],
  "audience": {"@type": "BusinessAudience", "audienceType": "Businesses with annual revenue of at least $3 million"},
  "termsOfService": {{ program.path | absolute_url | jsonify }}
}
</script>
{% endif %}
