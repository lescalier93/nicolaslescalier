# Site configuration for Nicolas Lescalier Canadian and U.S. markets

# Basic settings
url: "https://nicolaslescalier.com"
title: "Nicolas Lescalier"
tagline: "Canada & U.S. Business Financing"
description: "Business financing guidance for businesses in Canada and the United States. Product availability depends on location and the financing request."
google_analytics_id: "G-F2SD579BRL"
social_image: "/assets/social-card.png"
social_image_width: 1200
social_image_height: 630
asset_version: "20260918-3"

author:
  name: "Nicolas Lescalier"
  url: "https://nicolaslescalier.com/about-nicolas-lescalier-us/"

# Plugins for sitemap generation and legacy URL redirects
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Optional: exclude vendor or tooling directories
exclude:
  - vendor
  - tests

# Markdown processing
markdown: kramdown

# Default layout assignment for pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
