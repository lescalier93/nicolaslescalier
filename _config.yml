# Site configuration for Nicolas Lescalier U.S. market

# Basic settings
url: "https://nicolaslescalier.com"
title: "Nicolas Lescalier"
tagline: "U.S. Business Financing"
description: "Commercial finance guidance for U.S. businesses comparing working capital, lines of credit, term loans, SBA, equipment, invoice finance, and CRE options."
google_analytics_id: "G-F2SD579BRL"
social_image: "/assets/social-card.png"
social_image_width: 1200
social_image_height: 630
asset_version: "20260712-1"

author:
  name: "Nicolas Lescalier"
  url: "https://nicolaslescalier.com/about-nicolas-lescalier-us/"

# Plugins for sitemap generation and legacy URL redirects
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Optional: exclude vendor or tooling directories
exclude:
  - vendor

# Markdown processing
markdown: kramdown

# Default layout assignment for pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
