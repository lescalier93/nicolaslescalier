name: Notify search engines

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository == 'lescalier93/nicolaslescalier' &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore last submitted page fingerprints
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-
      - name: Validate live pages and notify IndexNow
        run: python scripts/indexnow.py
      - name: Save successfully submitted page fingerprints
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
