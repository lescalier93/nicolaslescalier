name: Build website
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check loan calculation edge cases
        run: node --test tests/loan-calculator.test.cjs
      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Save review build
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: _site
