faq:
  - question: "What are the program's term and rates?"
    answer: "The program has a three-year (36-month) term and a rate range of 12–16% APR. APR is an annual percentage rate, not a monthly rate. The rate offered depends on underwriting and approval."
  - question: "How much annual revenue does my business need?"
    answer: "The minimum annual business revenue is $3 million. This is a revenue threshold, not a minimum loan amount. Meeting it does not guarantee approval."
  - question: "Can I apply remotely?"
    answer: "Yes. Nicolas Lescalier works fully online with businesses across Canada and the United States. There are no in-person client meetings. Availability and final terms depend on the business, location, and underwriting."
  - question: "Can I discuss financing if annual revenue is below $3 million?"
    answer: "Yes. This revenue threshold applies to the three-year term program. You can discuss other financing options without assuming that the same rates, term, or eligibility rules apply."
